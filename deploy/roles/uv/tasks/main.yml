---
# deploy-owned, not root-owned: `uv sync` writes here, and a webhook-triggered
# redeploy (deploy_webhook role) runs it as the deploy account rather than as
# root, so it needs write access to its own cache without any elevation.
# recurse: true so this also fixes up whatever a *previous*, root-driven uv
# sync already wrote in here (uv's own internal git cache, wheel cache, …) -
# without it only the top-level directory changes, and uv still hits
# permission-denied the first time it tries to touch a still-root-owned file
# underneath.
- name: Create the uv cache and Python directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "u=rwX,go=rX"
    recurse: true
  loop:
    - "{{ uv_cache_dir }}"
    - "{{ uv_python_install_dir }}"

- name: Read the installed uv version
  ansible.builtin.command: "{{ uv_install_dir }}/uv --version"
  register: uv_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install uv
  when: uv_installed.rc != 0 or uv_version not in uv_installed.stdout
  block:
    - name: Download the pinned uv installer
      ansible.builtin.get_url:
        url: https://astral.sh/uv/{{ uv_version }}/install.sh
        dest: /root/uv-install-{{ uv_version }}.sh
        owner: root
        group: root
        mode: "0700"

    - name: Run the uv installer
      ansible.builtin.command: /root/uv-install-{{ uv_version }}.sh
      environment:
        UV_INSTALL_DIR: "{{ uv_install_dir }}"
        INSTALLER_NO_MODIFY_PATH: "1"
      register: uv_install
      changed_when: uv_install.rc == 0
  always:
    - name: Remove the installer
      ansible.builtin.file:
        path: /root/uv-install-{{ uv_version }}.sh
        state: absent

# The checkout and everything `uv sync` writes into it (.venv included) need
# to end up owned by deploy, not root — a webhook-triggered redeploy
# (deploy_webhook role) runs both git and uv as that account, with no
# elevation. Running the two tasks below `become_user: deploy` gets there
# directly, rather than running them as root and chowning afterwards: the
# fixup approach was tried first, but git itself refuses to operate on a
# repository it doesn't own (its "dubious ownership" protection, which
# applies to root exactly as it would anyone else) — so root-then-chown works
# exactly once, and breaks root's own git invocation on every run after that.
#
# On a truly fresh host `deploy` cannot create {{ mcp_checkout_dir }} itself
# — /opt is root-owned — so this creates an empty, deploy-owned directory
# first for git to clone into. recurse: true so this also re-owns a host
# upgrading from before this account existed, where the checkout (and .venv)
# were cloned/synced root-owned: without it, only the top-level directory
# would change, and the become_user: deploy git command below would hit the
# same "dubious ownership" refusal the comment above describes, on
# directory contents rather than the directory itself.
- name: Create the checkout directory
  ansible.builtin.file:
    path: "{{ mcp_checkout_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "u=rwX,go=rX"
    recurse: true

# Unlike command/shell, the git module claims check-mode support — but
# predicting a change still means running real git against the checkout, so on
# a fresh host where "Install the base packages" only simulated installing
# git, there's no git binary yet to run. Same "first --check run reports less
# than a first real run" caveat the README already calls out for the
# environment sync and the browser download.
- name: Check out the application
  become_user: "{{ deploy_user }}"
  ansible.builtin.git:
    repo: "{{ mcp_repo_url }}"
    dest: "{{ mcp_checkout_dir }}"
    version: "{{ mcp_repo_version }}"
    depth: 1
    single_branch: true
  when: not ansible_check_mode
  notify: Restart browser-interaction-mcp

# --frozen respects uv.lock and fails rather than silently resolving something
# else; --no-dev omits ruff, mypy and the audit tooling, which have no purpose
# here.
#
# A custom changed_when makes Ansible run this for real even under --check —
# it can't evaluate that expression against output it never produced — so on
# a fresh host, where the checkout above was itself skipped under --check,
# chdir has nothing to change into. This is the "environment sync" the README
# already names as one of the things a first --check run can't show.
- name: Sync the environment from the lockfile
  become_user: "{{ deploy_user }}"
  ansible.builtin.command: "{{ uv_install_dir }}/uv sync --frozen --no-dev"
  args:
    chdir: "{{ mcp_checkout_dir }}"
  environment:
    UV_CACHE_DIR: "{{ uv_cache_dir }}"
    UV_PYTHON_INSTALL_DIR: "{{ uv_python_install_dir }}"
    UV_PYTHON_DOWNLOADS: automatic
  register: uv_sync
  # uv reports its work on stderr, and says "Audited N packages" when there was
  # nothing to do.
  changed_when: >-
    (uv_sync.stdout ~ uv_sync.stderr)
    is search('Installed|Uninstalled|Creating virtual environment')
  when: not ansible_check_mode
  notify: Restart browser-interaction-mcp
