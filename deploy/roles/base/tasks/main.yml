---
- name: Set the timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
  when: base_upgrade_packages | bool

- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Create the service group
  ansible.builtin.group:
    name: "{{ mcp_service_group }}"
    system: true

# Shell access on this host is equivalent to full control of every account the
# server automates, because anyone who can run a command can start the server on
# stdio and drive the browser without ever touching GitHub
# (docs/deployment.md §6). Hence: no interactive login, no password, nothing
# else co-located. The account is created here rather than in the `app` role
# because `storage` has to chown paths to it first.
- name: Create the service account
  ansible.builtin.user:
    name: "{{ mcp_service_user }}"
    group: "{{ mcp_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    password: "!"
    password_lock: true
    home: "{{ mcp_state_dir }}"
    create_home: false

- name: Configure unattended upgrades
  ansible.builtin.include_tasks: unattended_upgrades.yml
  when: base_unattended_upgrades | bool

- name: Harden SSH
  ansible.builtin.include_tasks: ssh.yml
  when: base_harden_ssh | bool

- name: Verify zram
  ansible.builtin.include_tasks: zram.yml
  when: base_zram_enabled | bool
