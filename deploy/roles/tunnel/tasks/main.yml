---
# If cloudflared was already set up by hand, it was most likely installed
# following Cloudflare's own docs, which predate deb822 sources and write a
# one-line-format repo file here instead. Left in place, apt would end up
# with two overlapping definitions of the same repository — not broken, but
# not a single source of truth either, and apt is happy to warn about it.
# Removing it before adding the deb822 one below makes this file the only
# thing managing that repo from here on, however it got there originally.
- name: Remove Cloudflare's legacy one-line apt source, if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
  register: tunnel_legacy_repo_removed

- name: Add the Cloudflare apt repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: [deb]
    uris: "{{ tunnel_apt_uri }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    architectures: [arm64]
    signed_by: "{{ tunnel_apt_key_url }}"
    state: present
    enabled: true
  register: tunnel_repo

- name: Update the apt cache for the new repository
  ansible.builtin.apt:
    update_cache: true
  when: tunnel_repo.changed or tunnel_legacy_repo_removed.changed  # noqa: no-handler — the next task needs it now

# state: present, not latest: if cloudflared is already installed — however it
# got there — this leaves its version alone rather than force-upgrading it on
# every run. The systemd unit below always points at /usr/bin/cloudflared, so
# whichever binary apt considers installed is the one that actually runs;
# nothing here depends on how it got installed originally.
- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present

- name: Create the cloudflared group
  ansible.builtin.group:
    name: "{{ tunnel_group }}"
    system: true

- name: Create the cloudflared account
  ansible.builtin.user:
    name: "{{ tunnel_user }}"
    group: "{{ tunnel_group }}"
    system: true
    shell: /usr/sbin/nologin
    password: "!"
    password_lock: true
    home: "{{ tunnel_config_dir }}"
    create_home: false

- name: Create the cloudflared configuration directory
  ansible.builtin.file:
    path: "{{ tunnel_config_dir }}"
    state: directory
    owner: root
    group: "{{ tunnel_group }}"
    mode: "0750"

# The tunnel secret is as good as the hostname itself: anything holding it can
# answer for https://{{ mcp_public_hostname }}.
- name: Install the named tunnel's credentials
  ansible.builtin.copy:
    content: "{{ mcp_tunnel_credentials | to_nice_json }}\n"
    dest: "{{ tunnel_config_dir }}/{{ mcp_tunnel_id }}.json"
    owner: "{{ tunnel_user }}"
    group: "{{ tunnel_group }}"
    mode: "0600"
  no_log: true
  notify: Restart cloudflared

- name: Install the cloudflared configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ tunnel_config_dir }}/config.yml"
    owner: root
    group: "{{ tunnel_group }}"
    mode: "0640"
  notify: Restart cloudflared

# Written here rather than generated by `cloudflared service install`, which is
# neither idempotent nor declarative, and which would run the tunnel as root.
- name: Install the cloudflared systemd unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/{{ tunnel_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared

- name: Enable and start the tunnel
  ansible.builtin.systemd_service:
    name: "{{ tunnel_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
