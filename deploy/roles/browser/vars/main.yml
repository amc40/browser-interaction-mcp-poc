---
# Chromium's shared library dependencies, declared explicitly rather than
# discovered by `playwright install-deps`: that command keys off the ID field
# in /etc/os-release and has known failures on Debian derivatives it does not
# recognise, which is why the usual workaround is
# `install-deps || echo "install manually"`. An explicit apt list is pinned,
# idempotent, and immune to upstream changing its distro detection.
#
# These are the Debian 12 (bookworm) names. Debian 13 renamed several of them
# for the 64-bit time_t transition (libasound2t64, libatk1.0-0t64, ...), so this
# list needs revisiting if the Pi is ever upgraded to trixie.
browser_apt_packages:
  - fonts-freefont-ttf
  - fonts-liberation
  - fonts-noto-color-emoji
  - libasound2
  - libatk-bridge2.0-0
  - libatk1.0-0
  - libatspi2.0-0
  - libcairo2
  - libcups2
  - libdbus-1-3
  - libdrm2
  - libgbm1
  - libglib2.0-0
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
