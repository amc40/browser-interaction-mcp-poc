---
# Chromium only. `playwright install chrome` fails on Linux arm64 — Chrome for
# Testing publishes no arm64 Linux build — so never set channel="chrome" in
# tools.py either.
browser_playwright_browsers:
  - chromium

# Needed by browser_interaction_mcp.browser.browser_page(headless=False):
# Akamai's Bot Manager (Sainsbury's, Tesco - see sainsburys.py's module
# docstring) blocks headless Chromium specifically, so any headed session
# needs a real X display to run under. browser_page starts and stops its own
# short-lived Xvfb display per call, using only the `Xvfb` binary this
# installs - not the whole service wrapped in `xvfb-run`.
browser_install_xvfb: true
