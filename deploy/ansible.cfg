# Run every command in this file's directory, so these relative paths resolve.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
interpreter_python = /usr/bin/python3
retry_files_enabled = false
display_skipped_hosts = false
# One host, one browser, one process. Parallelism buys nothing and makes the
# output harder to read.
forks = 1

[ssh_connection]
pipelining = true
