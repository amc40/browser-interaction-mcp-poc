# Everything an app needs that is not about one particular site: the server and
# its middleware, GitHub authentication, the browser lifecycle, the login
# framework, redaction and the deploy webhook. Nothing in here names a site, and
# `make check` fails if that stops being true - see packages/core/tests/test_core_is_site_agnostic.py.
[project]
name = "browser-mcp-core"
version = "0.1.0"
description = "Site-agnostic core for MCP servers exposing pre-approved browser actions"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "amc40" }]
dependencies = [
    # Floor pinned above every published Authlib advisory, notably the
    # cache-backed state CSRF fixed in 1.6.11 (CVE-2026-41425). See
    # login_oauth.py for why this integration must stay session-backed.
    "authlib>=1.7.1,<2",
    "fastmcp>=3.4.5,<4",
    "httpx>=0.28.1,<0.29",
    # What starlette's SessionMiddleware signs the login cookie with; it is
    # starlette's own choice for that (listed in its "full" extra).
    "itsdangerous>=2.2.0,<3",
    "mcp>=1.29.0,<2",
    "playwright>=1.56.0,<2",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "starlette>=1.3.1,<2",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.deptry]
known_first_party = ["browser_mcp_core"]

[tool.deptry.per_rule_ignores]
# `mcp` is only imported under `TYPE_CHECKING`, which deptry does not see, but
# the types come straight from it so it stays a direct dependency.
#
# `itsdangerous` is never imported by this package: starlette's
# SessionMiddleware imports it. Starlette declares it only in its "full" extra,
# so nothing else guarantees it is installed and it has to be declared here.
DEP002 = ["mcp", "itsdangerous"]
