---
# The hosts the fleet runs on. Apps are assigned to a host in apps.yml, by the
# host's name here. An app runs on exactly one host, because its rate limiter,
# token cache and site session all live in one process; more hosts hold more
# apps, they never replicate one. See docs/scaling-plan.md D9.
#
# Each host runs its own named tunnel, so its tunnel ID and credentials go in
# inventory/host_vars/<host>/vault.yml once there is more than one. With one
# host they can stay in group_vars/browser_mcp/vault.yml.
browser_mcp:
  hosts:
    pi:
      ansible_host: pi-generic-server.local
      ansible_user: amc40
      # The memory every app on this host may use between them: the shared
      # slice's MemoryMax, and what site.yml checks the apps' memory_high_mb
      # against before changing anything. Leave room for the OS, cloudflared
      # and the deploy units. Sized for a 4GB Pi 4.
      fleet_memory_budget_mb: 3072
