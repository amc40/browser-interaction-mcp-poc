# Run every command in this file's directory, so these relative paths resolve.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
interpreter_python = /usr/bin/python3
retry_files_enabled = false
display_skipped_hosts = false
# A handful of hosts at most, each provisioned the same way. Running them one
# at a time keeps the output readable and the memory checks sequential.
forks = 1

[ssh_connection]
pipelining = true
