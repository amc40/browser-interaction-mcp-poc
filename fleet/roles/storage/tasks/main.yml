---
# Phase 1: storage_mount_ssd is false by default, and nothing in this file
# above the "Create the fleet's state root" task runs at all -
# fleet_state_root / fleet_browsers_dir already resolve to SD-card paths (see
# vars.yml), so the directory-creation tasks are all that's needed.
#
# Phase 2: once storage_mount_ssd: true and storage_ssd_uuid are set, the
# tasks below mount the SSD on every run, and migrate.yml runs once — only
# when explicitly requested with --tags migrate — to copy Phase 1's state
# across before anything creates fresh empty directories at the new location.
- name: Assert the SSD has been identified
  ansible.builtin.assert:
    that:
      - storage_ssd_uuid | length > 0
    fail_msg: >-
      storage_mount_ssd is true but storage_ssd_uuid is empty. Set it to the
      filesystem UUID of the SSD (`lsblk -f` on the Pi), or set
      storage_mount_ssd: false if there's no SSD yet (Phase 1), or if the
      whole system already boots from one.
    quiet: true
  when: storage_mount_ssd | bool
  tags: [migrate]

- name: Create the SSD mountpoint
  ansible.builtin.file:
    path: "{{ fleet_ssd_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: storage_mount_ssd | bool
  tags: [migrate]

- name: Mount the SSD
  ansible.posix.mount:
    path: "{{ fleet_ssd_mountpoint }}"
    src: UUID={{ storage_ssd_uuid }}
    fstype: "{{ storage_ssd_fstype }}"
    opts: "{{ storage_ssd_options }}"
    state: mounted
  when: storage_mount_ssd | bool
  tags: [migrate]

# Run-once, and only when asked for: tagged `never` in addition to `migrate`,
# so an ordinary run (no --tags, or any other --tags) always skips it, no
# matter how many times it's re-applied. See the file for what it does when
# there's nothing to migrate, and what it deliberately leaves behind.
- name: Migrate Phase 1's SD-card state onto the SSD
  ansible.builtin.include_tasks: migrate.yml
  when: storage_mount_ssd | bool
  tags: [migrate, never]

# Each app's own state directory under this is created, owned by that app's
# service account, by roles/app. This one is only a place to put them.
- name: Create the fleet's state root
  ansible.builtin.file:
    path: "{{ fleet_state_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Shared by every app, because ~400MB per app does not fit on a Pi, and
# root-owned, because it is shared: only a playbook run, as root, downloads into
# it (roles/browser). No app's service or deploy account can replace a browser
# another app is about to execute (docs/scaling-plan.md D3).
- name: Create the Playwright browsers directory
  ansible.builtin.file:
    path: "{{ fleet_browsers_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
