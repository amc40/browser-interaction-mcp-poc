---
# Chromium's shared library dependencies, declared explicitly rather than
# discovered by `playwright install-deps`: that command keys off the ID field
# in /etc/os-release and has known failures on Debian derivatives it does not
# recognise, which is why the usual workaround is
# `install-deps || echo "install manually"`. An explicit apt list is pinned,
# idempotent, and immune to upstream changing its distro detection.
#
# These are the Debian 13 (trixie) names, matching current Raspberry Pi OS
# images (rebased on trixie since October 2025). Six of them carry the t64
# suffix from Debian's 64-bit time_t transition — libasound2, libatk1.0-0,
# libatk-bridge2.0-0, libatspi2.0-0, libcups2 and libglib2.0-0 all renamed;
# the rest did not. Sourced from Playwright's own per-distro dependency table
# (nativeDeps.ts, debian13-x64) rather than reconstructed by hand. Revisit
# this list, and the "t64" note, if the Pi is ever downgraded to a bookworm
# image or upgraded past trixie.
browser_apt_packages:
  - fonts-freefont-ttf
  - fonts-liberation
  - fonts-noto-color-emoji
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libdrm2
  - libgbm1
  - libglib2.0-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
