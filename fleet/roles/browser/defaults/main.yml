---
# Chromium only. `playwright install chrome` fails on Linux arm64 — Chrome for
# Testing publishes no arm64 Linux build — so never set channel="chrome" in a
# site's tools.py either.
browser_playwright_browsers:
  - chromium

# Needed by browser_mcp_core.browser.browser_page(headless=False): Akamai's Bot
# Manager (Sainsbury's, Tesco) blocks headless Chromium specifically, so any
# headed session needs a real X display to run under. browser_page starts and
# stops its own short-lived Xvfb display per call, using only the `Xvfb` binary
# this installs. Installed on a host when any app assigned to it is headed in
# apps.yml.
browser_install_xvfb: "{{ fleet_host_apps | selectattr('value.headed') | list | length > 0 }}"
