---
# In site.yml's pre_tasks, before anything is changed: does this host still run
# the single-app deployment, and if so, has this run been told to cut it over?
#
# The cut-over stops the running app, so it is never something a routine run
# does by surprise: until it has happened, every run needs
# -e fleet_legacy_cutover=true. Rehearse with --check --diff first.
- name: Look for the single-app deployment's unit
  ansible.builtin.stat:
    path: "{{ legacy_systemd_dir }}/{{ legacy_app_unit }}"
  register: legacy_unit_stat

- name: Look for a completed cut-over
  ansible.builtin.stat:
    path: "{{ legacy_marker }}"
  register: legacy_marker_stat

- name: Note whether the cut-over is still to do
  ansible.builtin.set_fact:
    legacy_pending: >-
      {{ legacy_unit_stat.stat.exists
         and not legacy_marker_stat.stat.exists
         and legacy_app in (fleet_host_apps | map(attribute='key')) }}

- name: Assert the run means to cut the single-app deployment over
  ansible.builtin.assert:
    that:
      - not legacy_pending or (fleet_legacy_cutover | default(false) | bool)
    fail_msg: >-
      {{ inventory_hostname }} still runs the single-app deployment
      ({{ legacy_app_unit }}). This run would stop it, copy its state from
      {{ legacy_state_dir }} to {{ legacy_target_state_dir }} and start
      browser-mcp@{{ legacy_app }}.service in its place. Rehearse with
      --check --diff -e fleet_legacy_cutover=true, then run with
      -e fleet_legacy_cutover=true. See fleet/README.md, "Cutting over from
      the single-app deployment".
    quiet: true

# So CI's existing DEPLOY_WEBHOOK_SECRET goes on verifying against the new
# receiver, which listens on the same port behind the same hostname: the app's
# webhook secret starts as the old one (roles/app/tasks/prepare.yml).
- name: Carry the single-app deployment's webhook secret over
  when: legacy_pending
  block:
    - name: Look for the single-app deployment's webhook settings
      ansible.builtin.stat:
        path: "{{ legacy_webhook_env }}"
      register: legacy_webhook_env_stat

    - name: Read the single-app deployment's webhook settings
      ansible.builtin.slurp:
        src: "{{ legacy_webhook_env }}"
      register: legacy_webhook_env_file
      when: legacy_webhook_env_stat.stat.exists
      no_log: true

    - name: Keep its webhook secret for the app
      ansible.builtin.set_fact:
        legacy_webhook_seed: >-
          {{ {legacy_app: ((legacy_webhook_env_file.content | b64decode).splitlines()
              | select('match', 'DEPLOY_WEBHOOK_SECRET=.') | first
              | regex_replace('^DEPLOY_WEBHOOK_SECRET=', '') | trim)} }}
      when:
        - legacy_webhook_env_stat.stat.exists
        - (legacy_webhook_env_file.content | b64decode).splitlines() | select('match', 'DEPLOY_WEBHOOK_SECRET=.') | list | length > 0
      no_log: true
