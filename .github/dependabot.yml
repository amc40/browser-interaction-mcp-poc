version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a brand-new release, so a compromised or yanked
    # version has time to be caught before it lands in a PR here.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # One PR for all the tooling, but runtime dependencies stay separate so a
      # failing linter bump never blocks a security patch to a runtime package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only default-days is supported here; the semver-* cooldown keys are
    # rejected for the github-actions ecosystem.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
