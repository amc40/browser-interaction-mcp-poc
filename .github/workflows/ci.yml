name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so newly published advisories are caught even without a push.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail rather than silently resolving new versions if uv.lock is stale.
  UV_FROZEN: "1"

jobs:
  quality:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: format
            run: uv run ruff format --check --diff .
          - name: lint
            run: uv run ruff check --output-format=github .
          - name: types
            run: uv run mypy
          - name: dependencies
            # Once per workspace member: deptry reads the declared dependencies
            # from the pyproject.toml in its working directory.
            run: |
              cd packages/core && uv run --project ../.. deptry src tests
              cd ../sainsburys && uv run --project ../.. deptry src tests
          - name: vulnerabilities
            run: ./scripts/audit.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: ${{ matrix.gate.run }}

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Audit the workflows themselves
        # Online here, unlike the pre-commit hook, so the audits that resolve
        # action refs against the GitHub API also run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.28.0 .github/

  # A claude/heal-* branch may change one site's locators.py and test fixtures,
  # nothing else (see browser_mcp_core/heal_surface.py). Runs on every pull
  # request and passes at once on any other branch; the `ci` gate below
  # requires it there and ignores it on a push to main, where it is skipped.
  heal-surface:
    name: heal surface
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base with the base branch has to be in the clone.
          fetch-depth: 0
      - name: A heal branch stays within its surface
        # The checker is taken from the base commit, not the branch: a branch
        # that edited it could otherwise approve itself. Stdlib only, so the
        # runner's own Python runs it without a uv sync.
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          source="packages/core/src/browser_mcp_core/heal_surface.py"
          if ! git cat-file -e "$BASE_SHA:$source"; then
            # Only until the pull request that adds the checker has merged.
            echo "The base has no heal-surface checker yet: nothing to check"
            exit 0
          fi
          checker="$RUNNER_TEMP/heal_surface.py"
          git show "$BASE_SHA:$source" > "$checker"
          python3 "$checker" --branch "$HEAD_REF" --base "$BASE_SHA"

  # The fleet's Ansible, which none of the Python gates can see: ansible-lint,
  # a syntax check, and a render of every template against a two-host sample
  # fleet (fleet/tests/render.yml). Through make, so CI and a laptop pin the
  # same versions.
  fleet:
    name: fleet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: make fleet

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build and validate the distributions
        # --all-packages: the workspace root ships no code of its own, so a
        # bare `uv build` would have nothing to do and silently pass.
        run: |
          uv build --all-packages
          uvx twine check --strict dist/*

  # The one check branch protection needs to require: it passes only when every
  # other job passed or was skipped (heal-surface is, on a push), so adding a
  # job never means editing the protection rules too.
  gate:
    name: ci
    runs-on: ubuntu-latest
    needs: [quality, lockfile, test, workflows, heal-surface, fleet, build]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS"

  # Fast path for a code-only change: once everything else on a push to main has
  # passed, notify the webhook receiver of each app the push affects - via the
  # Cloudflare Tunnel of the host that app runs on (see fleet/README.md). A
  # change to one site's package redeploys that app; a change to core, the
  # lockfile or the deploy script redeploys every app; docs, tests, CI and the
  # fleet's Ansible redeploy nothing (browser_mcp_core/deploy_targets.py).
  deploy-targets:
    name: deploy targets
    runs-on: ubuntu-latest
    needs: [gate]
    # Explicit results rather than the implicit success(), which also counts
    # every job further up the chain - heal-surface is always skipped on a push
    # to main, so that check would skip the deploy even after `ci` passed.
    if: >-
      !cancelled() && needs.gate.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.targets.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit main pointed at before the push has to be in the clone.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Work out which apps the push affects
        id: targets
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          # No project is involved, so there is no lockfile to be frozen to.
          UV_FROZEN: "false"
        # apps.yml is YAML, which the runner's python3 cannot read, so a pinned
        # PyYAML turns each app's package into JSON for the stdlib-only script.
        run: |
          apps=$(uv run --no-project --with pyyaml==6.0.3 python -c \
            'import json, yaml; print(json.dumps({a: s["package"] for a, s in yaml.safe_load(open("fleet/apps.yml"))["apps"].items()}))')
          targets=$(python3 packages/core/src/browser_mcp_core/deploy_targets.py \
            --apps "$apps" --base "$BEFORE_SHA" --head "$AFTER_SHA")
          echo "Redeploying: $targets"
          echo "apps=$targets" >> "$GITHUB_OUTPUT"

  # One job per app, each in the GitHub environment named after the app, which
  # holds that app's own DEPLOY_WEBHOOK_URL and DEPLOY_WEBHOOK_SECRET - every
  # app's receiver has its own secret (docs/scaling-plan.md D5). An environment
  # without them would fall back to repository secrets of the same names, so
  # there should be none: see fleet/README.md.
  deploy:
    name: deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [deploy-targets]
    if: >-
      !cancelled() && needs.deploy-targets.result == 'success'
      && needs.deploy-targets.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.deploy-targets.outputs.apps) }}
    environment: ${{ matrix.app }}
    timeout-minutes: 2
    steps:
      - name: Notify ${{ matrix.app }}'s host to deploy it
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ github.sha }}
          APP: ${{ matrix.app }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::error::The $APP environment has no DEPLOY_WEBHOOK_URL or DEPLOY_WEBHOOK_SECRET; see fleet/README.md."
            exit 1
          fi
          body=$(jq -nc --arg sha "$DEPLOY_SHA" '{sha: $sha, ref: "refs/heads/main"}')
          signature="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" -r | cut -d' ' -f1)"
          curl --fail-with-body --max-time 10 --silent --show-error \
            --request POST "$DEPLOY_URL" \
            --header "X-Deploy-Signature: $signature" \
            --header "Content-Type: application/json" \
            --data "$body"
