name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so newly published advisories are caught even without a push.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail rather than silently resolving new versions if uv.lock is stale.
  UV_FROZEN: "1"

jobs:
  quality:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: format
            run: uv run ruff format --check --diff .
          - name: lint
            run: uv run ruff check --output-format=github .
          - name: types
            run: uv run mypy
          - name: dependencies
            run: uv run deptry src tests
          - name: vulnerabilities
            run: ./scripts/audit.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: ${{ matrix.gate.run }}

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Audit the workflows themselves
        # Online here, unlike the pre-commit hook, so the audits that resolve
        # action refs against the GitHub API also run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.28.0 .github/

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Build and validate the distribution
        run: |
          uv build
          uvx twine check --strict dist/*
