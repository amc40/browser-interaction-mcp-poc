name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so newly published advisories are caught even without a push.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail rather than silently resolving new versions if uv.lock is stale.
  UV_FROZEN: "1"

jobs:
  quality:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: format
            run: uv run ruff format --check --diff .
          - name: lint
            run: uv run ruff check --output-format=github .
          - name: types
            run: uv run mypy
          - name: dependencies
            # Once per workspace member: deptry reads the declared dependencies
            # from the pyproject.toml in its working directory.
            run: |
              cd packages/core && uv run --project ../.. deptry src tests
              cd ../sainsburys && uv run --project ../.. deptry src tests
          - name: vulnerabilities
            run: ./scripts/audit.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: ${{ matrix.gate.run }}

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Audit the workflows themselves
        # Online here, unlike the pre-commit hook, so the audits that resolve
        # action refs against the GitHub API also run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.28.0 .github/

  # A claude/heal-* branch may change one site's locators.py and test fixtures,
  # nothing else (see browser_mcp_core/heal_surface.py). Runs on every pull
  # request and passes at once on any other branch, so it can be a required
  # check. Not in `deploy`'s needs: it never runs on a push to main.
  heal-surface:
    name: heal surface
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base with the base branch has to be in the clone.
          fetch-depth: 0
      - name: A heal branch stays within its surface
        # The checker is taken from the base commit, not the branch: a branch
        # that edited it could otherwise approve itself. Stdlib only, so the
        # runner's own Python runs it without a uv sync.
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          source="packages/core/src/browser_mcp_core/heal_surface.py"
          if ! git cat-file -e "$BASE_SHA:$source"; then
            # Only until the pull request that adds the checker has merged.
            echo "The base has no heal-surface checker yet: nothing to check"
            exit 0
          fi
          checker="$RUNNER_TEMP/heal_surface.py"
          git show "$BASE_SHA:$source" > "$checker"
          python3 "$checker" --branch "$HEAD_REF" --base "$BASE_SHA"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build and validate the distributions
        # --all-packages: the workspace root ships no code of its own, so a
        # bare `uv build` would have nothing to do and silently pass.
        run: |
          uv build --all-packages
          uvx twine check --strict dist/*

  # Fast path for a code-only change: notify the Pi's webhook receiver
  # (deploy_webhook.py, via the Cloudflare Tunnel it's already reachable
  # through - see docs/pi-deployment.md) once every other job on this push has
  # passed. `needs:` on all of them, not a separate `workflow_run` trigger, is
  # what makes "only after CI is green" a property of this one workflow run
  # rather than something a second workflow has to re-derive.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [quality, lockfile, test, workflows, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 2
    steps:
      - name: Notify the Pi to deploy
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          body=$(jq -nc --arg sha "$DEPLOY_SHA" '{sha: $sha, ref: "refs/heads/main"}')
          signature="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" -r | cut -d' ' -f1)"
          curl --fail-with-body --max-time 10 --silent --show-error \
            --request POST "$DEPLOY_URL" \
            --header "X-Deploy-Signature: $signature" \
            --header "Content-Type: application/json" \
            --data "$body"
