[project]
name = "browser-interaction-mcp"
version = "0.1.0"
description = "An unofficial MCP server exposing pre-approved, deterministic browser actions"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "amc40" }]
dependencies = [
    # Floor pinned above every published Authlib advisory, notably the
    # cache-backed state CSRF fixed in 1.6.11 (CVE-2026-41425). See
    # login_oauth.py for why this integration must stay session-backed.
    "authlib>=1.7.1,<2",
    "fastmcp>=3.4.5,<4",
    "httpx>=0.28.1,<0.29",
    # What starlette's SessionMiddleware signs the login cookie with; it is
    # starlette's own choice for that (listed in its "full" extra).
    "itsdangerous>=2.2.0,<3",
    "mcp>=1.29.0,<2",
    "playwright>=1.56.0,<2",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "starlette>=1.3.1,<2",
]

[project.scripts]
browser-interaction-mcp = "browser_interaction_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "mypy>=1.18.2",
    "pip-audit>=2.9.0",
    "pre-commit>=4.4.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
    # Authlib ships no type information of its own.
    "types-authlib>=1.8.0",
]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Start from "everything", then subtract only the rules that fight the
# formatter or contradict another selected rule. Anything not listed in
# `ignore` is an error, so rules added in future ruff releases are opt-out
# rather than opt-in.
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma: conflicts with the formatter
    "CPY001", # this project does not use per-file copyright headers
    "D203",   # incompatible with D211 (blank line before class)
    "D213",   # incompatible with D212 (multi-line summary position)
    "ISC001", # single-line-implicit-string-concat: conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN401",  # test doubles legitimately forward **kwargs: Any
    "D103",    # a test's name is its documentation
    "PLR2004", # magic values are fine in assertions
    "S101",    # asserts are the point of a test
    "S105",    # the credentials in tests are fakes, and gitleaks checks the rest
    "S106",
    "SLF001",  # unit tests reach into private helpers directly on purpose
]
# One-off/exploratory scripts, not part of the tested, type-checked package:
# mypy's `files` setting already excludes this directory, and pytest's 100%
# coverage requirement would otherwise demand tests for throwaway code.
"scripts/**/*.py" = [
    "D103", # a CLI script's docstring is at module level, not repeated per-function
    "T201", # print is the point of a CLI script's output
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["browser_interaction_mcp"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
# Extras that `strict` does not turn on by itself.
warn_unreachable = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

# ---------------------------------------------------------------------------
# Tests / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["browser_interaction_mcp"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Dependency hygiene
# ---------------------------------------------------------------------------
[tool.deptry]
known_first_party = ["browser_interaction_mcp"]

[tool.deptry.per_rule_ignores]
# `mcp` is only imported under `TYPE_CHECKING`, which deptry does not see, but
# the types come straight from it so it stays a direct dependency.
#
# `itsdangerous` is never imported by this package: starlette's
# SessionMiddleware imports it. Starlette declares it only in its "full" extra,
# so nothing else guarantees it is installed and it has to be declared here.
DEP002 = ["mcp", "itsdangerous"]
