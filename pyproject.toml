# The workspace root. It ships no code of its own: it exists to hold the one
# gate configuration and the one lockfile that docs/scaling-plan.md D1 chose a
# monorepo in order to have. Every `[tool.*]` block below is written once here
# and applies to every package under `packages/`, which is the thing a repo per
# site cannot do - Python has no clean way to share a `[tool.ruff]` block, so
# split repositories each carry a copy and they drift.
[tool.uv.workspace]
members = ["packages/*"]

# Installed for the whole workspace, because every gate runs across every
# package at once rather than per package.
[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "mypy>=1.18.2",
    "pip-audit>=2.9.0",
    "pre-commit>=4.4.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
    # Authlib ships no type information of its own.
    "types-authlib>=1.8.0",
]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["packages/core/src", "packages/sainsburys/src"]

[tool.ruff.lint]
# Start from "everything", then subtract only the rules that fight the
# formatter or contradict another selected rule. Anything not listed in
# `ignore` is an error, so rules added in future ruff releases are opt-out
# rather than opt-in.
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma: conflicts with the formatter
    "CPY001", # this project does not use per-file copyright headers
    "D203",   # incompatible with D211 (blank line before class)
    "D213",   # incompatible with D212 (multi-line summary position)
    "ISC001", # single-line-implicit-string-concat: conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "ANN401",  # test doubles legitimately forward **kwargs: Any
    "D103",    # a test's name is its documentation
    "INP001",  # tests are collected by path under --import-mode=importlib, and
               # two `tests` packages under `packages/` would collide by name
    "PLR2004", # magic values are fine in assertions
    "S101",    # asserts are the point of a test
    "S105",    # the credentials in tests are fakes, and gitleaks checks the rest
    "S106",
    "SLF001",  # unit tests reach into private helpers directly on purpose
]
# Shared test scaffolding at the workspace root, held to the tests' rules
# rather than the packages'.
"conftest.py" = ["ANN401", "S106"]
"tests_support.py" = ["ANN401"]
"packages/core/tests/fake_site.py" = ["D103"]
# One-off/exploratory scripts, not part of the tested, type-checked packages:
# mypy's `files` setting already excludes this directory, and pytest's 100%
# coverage requirement would otherwise demand tests for throwaway code.
"scripts/**/*.py" = [
    "D103", # a CLI script's docstring is at module level, not repeated per-function
    "T201", # print is the point of a CLI script's output
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["browser_mcp_core", "browser_mcp_sainsburys"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["packages", "conftest.py", "tests_support.py"]
# Two packages' test suites legitimately contain a `test_settings.py` each.
# Without this mypy derives a module name from the file name alone and calls
# them duplicates; with it, the name is the path from the nearest base below,
# so each package's src stays importable as itself and the tests are distinct.
explicit_package_bases = true
mypy_path = "packages/core/src:packages/sainsburys/src:packages/core/tests:."
strict = true
# Extras that `strict` does not turn on by itself.
warn_unreachable = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

# ---------------------------------------------------------------------------
# Tests / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# One run over the whole workspace, not one per package: the coverage floor
# below is a property of the fleet's code, and a per-package run would let a
# core module be covered only by a site's tests without anyone noticing.
testpaths = ["packages/core/tests", "packages/sainsburys/tests"]
# Puts the workspace root on sys.path, so every package's tests can import the
# shared scaffolding in tests_support.py.
pythonpath = [".", "packages/core/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["browser_mcp_core", "browser_mcp_sainsburys"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol's method bodies are declarations, never executed.
    "^\\s*\\.\\.\\.$",
]
